<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ site.title }} - Homepage</title>
<meta name="description" content="{{ site.title }}, {{ site.description }}">
<link rel="canonical" href="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">

<meta property="og:locale" content="en">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ site.title }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:url" content="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">

<script>document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';</script>

<!-- ?v= changes on every build, so browsers never pair new HTML with a cached old stylesheet -->
<link rel="stylesheet" href="assets/css/main.css?v={{ site.time | date: '%s' }}">

<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">

<!-- open all links (papers, profiles) in a new tab -->
<base target="_blank">
